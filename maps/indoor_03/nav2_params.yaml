# Indoor profile for maps/indoor_01.
# This file is loaded automatically from map_dir; tune indoor values here only.
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.5
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node
      - scout_slow_forward_bt_node
    # Keep a valid lane path instead of replacing it every second, and never
    # use automatic Spin/BackUp recoveries near road or bridge boundaries.
    default_nav_to_pose_bt_xml: /home/nvidia/auto/ROS2_FOR_SCOUT_MINI/my_party/navigation_ws/src/scout_navigation_bringup/behavior_trees/navigate_to_pose_lane_safe.xml

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Do not abort and rebuild the route for a single noisy point-cloud frame.
    failure_tolerance: 2.0
    odom_topic: /odom
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker, precision_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.20
      required_movement_angle: 0.10
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Latch the reached position while the final heading converges.
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25

    # Only use this checker for grasp/place endpoints.  Transit and turning
    # points retain the normal tolerance so ordinary navigation stays robust.
    precision_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.08

    FollowPath:
      # MPPI evaluates complete future trajectories instead of steering toward
      # one pure-pursuit carrot. This removes alternating left/right corrections
      # and allows linear and angular motion to be commanded together on bends.
      plugin: nav2_mppi_controller::MPPIController
      motion_model: DiffDrive
      time_steps: 40
      model_dt: 0.10
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.15
      vy_std: 0.0
      # Keep angular sampling narrow on straight segments. The previous 0.30
      # spread repeatedly selected saturated steering for small heading errors.
      wz_std: 0.18
      vx_max: 0.35
      vx_min: 0.0
      vy_max: 0.0
      # On bends MPPI should reduce linear speed and turn continuously rather
      # than saturating yaw rate and then counter-steering.
      wz_max: 0.60
      temperature: 0.30
      gamma: 0.02
      prune_distance: 2.0
      transform_tolerance: 0.5
      max_robot_pose_search_dist: 3.0
      visualize: false
      retry_attempt_limit: 1
      reset_period: 1.0
      regenerate_noises: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.8
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.08
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 18
        # Follow the geometric tangent of the lattice path. The 16-heading
        # primitive file contains discretized pose yaws which caused MPPI to
        # chase heading steps even when the displayed path was straight.
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: lidar
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      track_unknown_space: true
      # Treat every non-white/unknown saved-map cell as a hard local boundary.
      # This keeps MPPI from steering into the gray area of the original map.
      unknown_cost_value: 254
      lethal_cost_threshold: 100
      trinary_costmap: true
      use_maximum: false
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.31, 0.225], [0.31, -0.225], [-0.31, -0.225], [-0.31, 0.225]]"
      # Keep saved-map walls compact, matching the proven outdoor_01 setup.
      # Live lidar obstacles receive a separate, larger safety buffer below.
      footprint_padding: 0.04
      # StaticLayer is required here so MPPI candidate trajectories also see
      # the gray boundary of the saved map, not only live point-cloud obstacles.
      plugins: [static_layer, voxel_layer, inflation_layer, dynamic_obstacle_buffer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        # The transformed sensor origin is about z=-0.33 m in the lidar world
        # frame. It must remain inside the voxel grid or raytracing cannot
        # clear old obstacles, which causes repeated false collisions.
        origin_z: -0.60
        z_resolution: 0.15
        z_voxels: 16
        max_obstacle_height: 1.80
        mark_threshold: 2
        unknown_threshold: 15
        observation_sources: body_cloud
        body_cloud:
          topic: /fastlio2/body_cloud
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.18
          max_obstacle_height: 1.50
          obstacle_min_range: 0.25
          obstacle_max_range: 5.0
          raytrace_min_range: 0.25
          raytrace_max_range: 10.0
          observation_persistence: 0.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # Compact inflation for obstacles already present in nav2_map.png.
        # This matches outdoor_01 and leaves more usable width in corridors.
        inflation_radius: 0.27
        cost_scaling_factor: 8.0
        inflate_unknown: false
        inflate_around_unknown: false

      # Add the larger margin only around new MID-360 detections. The plugin
      # excludes points that already belong to the saved static map, so map
      # walls remain at the compact 0.27 m inflation above.
      dynamic_obstacle_buffer:
        plugin: scout_navigation_bringup::DynamicObstacleBufferLayer
        enabled: true
        topic: /fastlio2/body_cloud
        map_topic: /map
        inflation_radius: 0.55
        inscribed_radius: 0.34
        cost_scaling_factor: 4.0
        min_obstacle_height: -0.18
        max_obstacle_height: 1.50
        obstacle_min_range: 0.25
        obstacle_max_range: 5.0
        observation_timeout: 0.40
        cluster_resolution: 0.20
        min_points_per_cluster: 3

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      resolution: 0.05
      track_unknown_space: true
      # Keep gray cells as genuine NO_INFORMATION in the global costmap. Smac
      # then rejects them through allow_unknown=false.
      unknown_cost_value: 255
      lethal_cost_threshold: 100
      trinary_costmap: true
      use_maximum: false
      footprint: "[[0.31, 0.225], [0.31, -0.225], [-0.31, -0.225], [-0.31, 0.225]]"
      # This is a hard geometric planning margin: the 0.45 m-wide body keeps
      # 0.05 m away from occupied/unknown map cells. It is not a larger cost
      # weight and therefore cannot be traded away for a shorter edge path.
      footprint_padding: 0.05
      plugins: [static_layer, obstacle_layer, inflation_layer, dynamic_obstacle_buffer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      # Feed the live MID-360 cloud into the global costmap as well as the
      # local costmap. Otherwise the global planner only sees the saved map
      # and can generate a path straight through newly detected obstacles.
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: body_cloud
        body_cloud:
          topic: /fastlio2/body_cloud
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.18
          max_obstacle_height: 1.50
          obstacle_min_range: 0.25
          obstacle_max_range: 6.0
          raytrace_min_range: 0.25
          raytrace_max_range: 10.0
          observation_persistence: 0.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # State Lattice already checks the complete padded rectangular
        # footprint against occupied/unknown cells. Enabling this layer makes
        # its INSCRIBED (253) band participate in the same footprint check and
        # can reject a physically clear start as "Starting point in lethal
        # space". Keep soft inflation in the local MPPI costmap instead.
        enabled: false
        inflation_radius: 0.50
        cost_scaling_factor: 1.2
        inflate_unknown: false
        inflate_around_unknown: true

      # Use the same separated live-obstacle margin during global replanning.
      # Static-map inflation stays disabled globally as before.
      dynamic_obstacle_buffer:
        plugin: scout_navigation_bringup::DynamicObstacleBufferLayer
        enabled: true
        topic: /fastlio2/body_cloud
        map_topic: /map
        inflation_radius: 0.55
        inscribed_radius: 0.34
        cost_scaling_factor: 4.0
        min_obstacle_height: -0.18
        max_obstacle_height: 1.50
        obstacle_min_range: 0.25
        obstacle_max_range: 6.0
        observation_timeout: 0.40
        cluster_resolution: 0.20
        min_points_per_cluster: 3

      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      # The differential-drive state lattice uses executable straight/arc
      # primitives and the full rectangular footprint for SE(2) collision
      # checking. A 0.5 m turning radius prevents straight-then-sharp-turn paths.
      plugin: nav2_smac_planner/SmacPlannerLattice
      lattice_filepath: /home/nvidia/auto/ROS2_FOR_SCOUT_MINI/.local_deps/root/opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json
      tolerance: 0.15
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.5
      reverse_penalty: 4.0
      change_penalty: 0.10
      non_straight_penalty: 1.05
      # Keep the standard lattice cost term; boundary clearance comes from the
      # padded footprint collision constraint above, not increased edge weight.
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      # Differential primitives include rotate-in-place. Keep it available for
      # genuinely confined spaces, but make mid-route shortcut spins expensive.
      rotation_penalty: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Humble loads both NavigateToPose and NavigateThroughPoses trees when the
    # BT navigator activates. The stock multi-pose tree requires these action
    # servers to exist, even though our lane-safe single-goal tree never calls
    # Spin or BackUp.
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: lidar
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.60
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    # Scout velocity feedback is quantized and delayed relative to the 20 Hz
    # smoother. CLOSED_LOOP kept ramping from stale measured yaw rate, causing
    # steering overshoot followed by an opposite correction.
    feedback: OPEN_LOOP
    max_velocity: [0.50, 0.0, 0.60]
    min_velocity: [-0.15, 0.0, -0.60]
    max_accel: [0.60, 0.0, 0.80]
    max_decel: [-0.80, 0.0, -0.80]
    odom_topic: /odom
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    # Bridge the slow-forward recovery into replanning without inserting a
    # timeout stop. Controller success/cancel still publishes an explicit zero.
    velocity_timeout: 3.0
