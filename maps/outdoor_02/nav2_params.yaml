# Outdoor road/bridge profile for maps/outdoor_01.
# Gray map cells are a hard boundary in both global planning and local control.
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.5
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node
      - scout_near_goal_condition_bt_node
      - scout_slow_forward_bt_node
    # Use the verified outdoor recovery tree.  The former outdoor_02-specific
    # file was empty, which prevented bt_navigator from activating at all.
    default_nav_to_pose_bt_xml: /home/nvidia/auto/ROS2_FOR_SCOUT_MINI/my_party/navigation_ws/src/scout_navigation_bringup/behavior_trees/navigate_to_pose_outdoor.xml

controller_server:
  ros__parameters:
    use_sim_time: false
    # 10 Hz leaves a full 100 ms budget per cycle on the Jetson, so FAST-LIO2
    # and the localizer keep their CPU share and map->base_link TF stays fresh.
    # A stable 10 Hz is smoother than a starved nominal 15 Hz.
    controller_frequency: 10.0
    # Always send a final zero Twist when navigation completes or is canceled.
    # The Piper workflow must wait for navigation success and a stationary base
    # before enabling arm motion.
    publish_zero_velocity: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Do not abort and rebuild the route for a single noisy point-cloud frame.
    failure_tolerance: 2.0
    odom_topic: /odom
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [normal_goal_checker, precision_goal_checker, staging_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.20
      required_movement_angle: 0.10
      movement_time_allowance: 20.0

    normal_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      # Ordinary route markers are pass-through points, not parking poses.
      # Position-only check: accept as soon as the chassis is within 1 m.
      # yaw tolerance pi means any heading satisfies the check, so the robot
      # never circles or slows to face the recorded/tangent heading at a
      # waypoint -- the next goal is sent immediately.
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 3.14

    precision_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.12

    # Dock staging poses are intermediate: the position must be accurate (the
    # odometry-locked crawl starts from it) and the heading should be roughly
    # respected, but not as tightly as the final grasp/place point. A 0.12 rad
    # yaw window stalls forever on lidar-localization noise; 0.30 rad (17 deg)
    # still aligns the chassis while the crawl finishes the yaw with wheel
    # odometry.
    staging_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.30

    FollowPath:
      # MPPI evaluates complete future trajectories instead of steering toward
      # one pure-pursuit carrot. This removes alternating left/right corrections
      # and allows linear and angular motion to be commanded together on bends.
      plugin: nav2_mppi_controller::MPPIController
      motion_model: DiffDrive
      # Keep a four-second horizon while reducing per-cycle work on Jetson.
      # Stable 10 Hz commands are more important than a longer horizon here.
      time_steps: 40
      model_dt: 0.10
      # Reduced from 900 with the controller back at 10 Hz: about 24万 cost
      # queries per second instead of 54万, keeping cycle time within budget.
      batch_size: 600
      iteration_count: 1
      # Keep enough forward candidates near the configured cruise ceiling.
      vx_std: 0.26
      vy_std: 0.0
      # Widened again so a U-turn can actually select the higher turning
      # samples; PathAlign/PathFollow critics still dominate on straight
      # segments and keep the steering sign stable.
      wz_std: 0.18
      # Stable outdoor cruise limit. Keep this matched with the smoother so
      # the controller can genuinely sustain 0.8 m/s on a straight segment.
      vx_max: 0.80
      vx_min: 0.0
      vy_max: 0.0
      # 0.60 keeps U-turns fluent at the higher cruise speed; matched by the
      # smoother limit. Tight avoidance is still braking-first.
      wz_max: 0.60
      temperature: 0.30
      gamma: 0.02
      prune_distance: 2.0
      transform_tolerance: 0.5
      max_robot_pose_search_dist: 3.0
      visualize: false
      retry_attempt_limit: 1
      reset_period: 1.0
      regenerate_noises: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        # React to the soft cost field before the padded footprint reaches an
        # obstacle. At 0.5 m/s this gives the smoother room to brake instead of
        # relying on the last collision check.
        cost_weight: 6.0
        critical_cost: 220.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.8
      GoalCritic:
        enabled: true
        cost_power: 1
        # Apply progress pressure before the final approach, so an unobstructed
        # route cruises near vx_max instead of indefinitely selecting ~0.3 m/s.
        cost_weight: 8.0
        threshold_to_consider: 5.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        # Ordinary waypoints are position-only, so do not pressure MPPI to
        # slow and rotate to the goal heading near the end (that caused
        # hovering around a waypoint). U-turn heading is still driven by
        # PathAngleCritic during the turn itself.
        cost_weight: 0.5
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # Stay closer to the State Lattice path so the local controller does
        # not cut a visually straight lane into the unknown map boundary.
        cost_weight: 3.0
        max_path_occupancy_ratio: 0.08
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 18
        # Follow the geometric tangent of the lattice path. The 16-heading
        # primitive file contains discretized pose yaws which caused MPPI to
        # chase heading steps even when the displayed path was straight.
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 12
        threshold_to_consider: 5.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        # Strong U-turn pressure: near-zero penalty on straight segments
        # (heading aligns with the path end), large penalty when the target
        # is behind the vehicle, so MPPI picks turning samples decisively.
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # Relaxed so turning samples that trade forward speed for yaw are not
        # suppressed during a U-turn; straight cruising is unaffected.
        cost_weight: 6.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      # Matched to the 10 Hz controller; halving the update rate frees CPU for
      # FAST-LIO2 without degrading the MPPI cost field.
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: lidar
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      track_unknown_space: true
      # MPPI in ROS 2 Humble intentionally regards NO_INFORMATION (255) as
      # non-collision while unknown tracking is enabled. Use a deliberately
      # different input unknown value here: incoming map -1 becomes byte 255,
      # misses this 254 sentinel, and StaticLayer converts it to LETHAL (254).
      # Thus the gray region is a hard local-controller boundary.
      unknown_cost_value: 254
      lethal_cost_threshold: 100
      trinary_costmap: true
      # StaticLayer runs first. Live lidar obstacles are added only by the
      # filtered dynamic layer below, preventing raw ground noise from being
      # marked a second time by VoxelLayer.
      use_maximum: false
      # A 10 m outdoor window sees lane edges and moving obstacles earlier.
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[0.31, 0.225], [0.31, -0.225], [-0.31, -0.225], [-0.31, 0.225]]"
      # Saved-map obstacles keep only a small geometric margin. Live lidar
      # obstacles receive their larger margin in dynamic_obstacle_buffer.
      footprint_padding: 0.06
      # Use Nav2's standard composition order. The earlier experimental order
      # put StaticLayer last; changing its merge mode then exposed every close
      # lidar return at once and the 0.45 m inflation engulfed the robot.
      plugins: [static_layer, voxel_layer, inflation_layer, dynamic_obstacle_buffer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        # The MID-360S is 0.30 m above the ground, while runtime transforms
        # place its origin as low as z=-0.63 m in this costmap frame. Keep the
        # sensor origin inside the grid so raytracing can clear moved objects.
        # Humble supports at most 16 vertical voxels. This grid spans
        # -0.80 m .. 2.08 m.
        origin_z: -0.80
        z_resolution: 0.18
        z_voxels: 16
        max_obstacle_height: 2.08
        # Mark on a single voxel so a ~0.30 m obstacle is not lost after the
        # height filter. The input is the filtered cloud, so ground noise is
        # already removed and cannot be marked a second time.
        mark_threshold: 1
        unknown_threshold: 15
        observation_sources: filtered_cloud
        filtered_cloud:
          topic: /nav/filtered_obstacle_cloud
          data_type: PointCloud2
          marking: true
          clearing: true
          # The filtered cloud already clips to these heights; keep the layer
          # bounds matching so marking and ray clearing stay consistent.
          min_obstacle_height: -0.05
          max_obstacle_height: 1.35
          # Ignore close body/mount reflections and observe obstacles earlier.
          obstacle_min_range: 0.35
          obstacle_max_range: 5.0
          raytrace_min_range: 0.35
          raytrace_max_range: 6.0
          observation_persistence: 0.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # This is the saved-map margin used by the local controller. It is
        # broad enough to reject edge-skimming without closing narrow lanes.
        inflation_radius: 0.42
        cost_scaling_factor: 5.0
        inflate_unknown: false
        inflate_around_unknown: false

      dynamic_obstacle_buffer:
        plugin: scout_navigation_bringup::DynamicObstacleBufferLayer
        enabled: true
        topic: /nav/filtered_obstacle_cloud
        map_topic: /map
        # Live people and obstacles receive an earlier safety zone at 0.6 m/s.
        inflation_radius: 0.75
        inscribed_radius: 0.50
        cost_scaling_factor: 4.0
        min_obstacle_height: -0.05
        max_obstacle_height: 1.35
        obstacle_min_range: 0.35
        obstacle_max_range: 5.0
        observation_timeout: 0.25
        cluster_resolution: 0.25
        min_points_per_cluster: 8

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      # The 0.5 Hz behavior-tree replan gates path regeneration, so a 2 Hz
      # global costmap still clears moved obstacles before the next replan.
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      resolution: 0.05
      track_unknown_space: true
      # Keep gray cells as genuine NO_INFORMATION in the global costmap. Smac
      # then rejects them through allow_unknown=false.
      unknown_cost_value: 255
      lethal_cost_threshold: 100
      trinary_costmap: true
      use_maximum: false
      footprint: "[[0.31, 0.225], [0.31, -0.225], [-0.31, -0.225], [-0.31, 0.225]]"
      # This is a hard geometric planning margin: the 0.45 m-wide body keeps
      # 0.07 m away from occupied/unknown map cells. It is not a larger cost
      # weight and therefore cannot be traded away for a shorter edge path.
      # Global paths may approach saved map edges more closely; local dynamic
      # obstacle buffering still keeps a larger safety margin around live data.
      footprint_padding: 0.06
      plugins: [static_layer, obstacle_layer, inflation_layer, dynamic_obstacle_buffer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        # Raw body cloud gives the global planner a long 10 m view so a new
        # obstacle is avoided before the local controller reaches it. The
        # -0.15 m lower height bound rejects ground returns.
        observation_sources: body_cloud
        body_cloud:
          topic: /fastlio2/body_cloud
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.15
          max_obstacle_height: 1.70
          obstacle_min_range: 0.35
          obstacle_max_range: 10.0
          raytrace_min_range: 0.35
          raytrace_max_range: 12.0
          observation_persistence: 0.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Make the global planner choose the centre of the white road instead
        # of skimming its unknown/occupied boundary.
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 4.0
        inflate_unknown: false
        inflate_around_unknown: true

      # The same live-cloud buffer is used for global replanning, so a new
      # obstacle is avoided before the local controller reaches it.
      dynamic_obstacle_buffer:
        plugin: scout_navigation_bringup::DynamicObstacleBufferLayer
        enabled: true
        topic: /nav/filtered_obstacle_cloud
        map_topic: /map
        inflation_radius: 0.75
        inscribed_radius: 0.50
        cost_scaling_factor: 4.0
        min_obstacle_height: -0.05
        max_obstacle_height: 1.35
        obstacle_min_range: 0.35
        obstacle_max_range: 5.0
        observation_timeout: 0.25
        cluster_resolution: 0.25
        min_points_per_cluster: 8

      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 0.75
    planner_plugins: [GridBased]
    GridBased:
      # The differential-drive state lattice uses executable straight/arc
      # primitives and the full rectangular footprint for SE(2) collision
      # checking. A 0.5 m turning radius prevents straight-then-sharp-turn paths.
      plugin: nav2_smac_planner/SmacPlannerLattice
      lattice_filepath: /home/nvidia/auto/ROS2_FOR_SCOUT_MINI/.local_deps/root/opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json
      tolerance: 0.10
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.5
      reverse_penalty: 4.0
      change_penalty: 0.10
      non_straight_penalty: 1.05
      # Boundary clearance comes from the padded footprint collision check.
      # Prefer a short valid route in open white space. Collision clearance is
      # still enforced by the padded footprint and the inflated costmaps.
      cost_penalty: 1.3
      retrospective_penalty: 0.015
      # Differential primitives include rotate-in-place. Keep it available for
      # genuinely confined spaces, but make mid-route shortcut spins expensive.
      rotation_penalty: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Humble loads both NavigateToPose and NavigateThroughPoses trees when the
    # BT navigator activates. The stock multi-pose tree requires these action
    # servers to exist, even though our lane-safe single-goal tree never calls
    # Spin or BackUp.
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: lidar
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.50
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.8

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      # Leave the chassis one second to settle before the next waypoint task.
      waypoint_pause_duration: 1000

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    # Preserve the commanded linear/angular ratio while applying acceleration
    # limits. A sharp turn therefore also reduces forward speed.
    scale_velocities: true
    # Scout velocity feedback is quantized and delayed relative to the 20 Hz
    # smoother. CLOSED_LOOP kept ramping from stale measured yaw rate, causing
    # steering overshoot followed by an opposite correction.
    feedback: OPEN_LOOP
    # Outdoor cruise ceiling. The bounded yaw settings below retain the
    # current straight, smooth driving behaviour.
    max_velocity: [0.80, 0.0, 0.60]
    min_velocity: [-0.15, 0.0, -0.40]
    # Resume promptly after a dynamic obstacle has cleared, while keeping
    # braking stronger than acceleration at the outdoor cruise speed.
    max_accel: [0.90, 0.0, 0.40]
    max_decel: [-1.70, 0.0, -0.70]
    odom_topic: /odom
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3
