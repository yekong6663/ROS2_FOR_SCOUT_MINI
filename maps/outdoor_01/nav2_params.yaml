# Outdoor road/bridge profile for maps/outdoor_01.
# Gray map cells are a hard boundary in both global planning and local control.
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.5
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node
      - scout_near_goal_condition_bt_node
    # The outdoor tree only permits collision-checked BackUp near the goal;
    # of the goal; it never uses blind Spin recovery beside road boundaries.
    default_nav_to_pose_bt_xml: /home/nvidia/auto/ROS2_FOR_SCOUT_MINI/my_party/navigation_ws/src/scout_navigation_bringup/behavior_trees/navigate_to_pose_outdoor.xml

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    # Always send a final zero Twist when navigation completes or is canceled.
    # The Piper workflow must wait for navigation success and a stationary base
    # before enabling arm motion.
    publish_zero_velocity: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Do not abort and rebuild the route for a single noisy point-cloud frame.
    failure_tolerance: 2.0
    odom_topic: /odom
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [normal_goal_checker, precision_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.20
      required_movement_angle: 0.10
      movement_time_allowance: 20.0

    normal_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.50

    precision_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.12

    FollowPath:
      # MPPI evaluates complete future trajectories instead of steering toward
      # one pure-pursuit carrot. This removes alternating left/right corrections
      # and allows linear and angular motion to be commanded together on bends.
      plugin: nav2_mppi_controller::MPPIController
      motion_model: DiffDrive
      # Keep a four-second horizon while reducing per-cycle work on Jetson.
      # Stable 10 Hz commands are more important than a longer horizon here.
      time_steps: 40
      model_dt: 0.10
      batch_size: 900
      iteration_count: 1
      # Keep enough low-speed samples for early dynamic-obstacle deceleration.
      vx_std: 0.20
      vy_std: 0.0
      # Include enough turning candidates to route around an obstacle instead
      # of repeatedly sampling almost-straight stop/go trajectories.
      wz_std: 0.28
      # Outdoor straight-line speed ceiling. Curves, goals and obstacle costs
      # can command substantially less than this 0.50 m/s cruise limit.
      vx_max: 0.50
      vx_min: 0.0
      vy_max: 0.0
      # Limit abrupt steering. The velocity smoother scales linear speed down
      # whenever angular acceleration is the limiting component.
      wz_max: 0.65
      temperature: 0.30
      gamma: 0.02
      prune_distance: 2.0
      transform_tolerance: 0.5
      max_robot_pose_search_dist: 3.0
      visualize: false
      retry_attempt_limit: 1
      reset_period: 1.0
      regenerate_noises: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        # React to the soft cost field before the padded footprint reaches an
        # obstacle. At 0.5 m/s this gives the smoother room to brake instead of
        # relying on the last collision check.
        cost_weight: 6.0
        critical_cost: 220.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.8
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # Stay closer to the State Lattice path so the local controller does
        # not cut a visually straight lane into the unknown map boundary.
        cost_weight: 18.0
        max_path_occupancy_ratio: 0.08
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 18
        # Follow the geometric tangent of the lattice path. The 16-heading
        # primitive file contains discretized pose yaws which caused MPPI to
        # chase heading steps even when the displayed path was straight.
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: lidar
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      track_unknown_space: true
      # MPPI in ROS 2 Humble intentionally regards NO_INFORMATION (255) as
      # non-collision while unknown tracking is enabled. Use a deliberately
      # different input unknown value here: incoming map -1 becomes byte 255,
      # misses this 254 sentinel, and StaticLayer converts it to LETHAL (254).
      # Thus the gray region is a hard local-controller boundary.
      unknown_cost_value: 254
      lethal_cost_threshold: 100
      trinary_costmap: true
      # StaticLayer runs first and initializes the rolling window from /map.
      # VoxelLayer then merges live lidar obstacles with that static result.
      use_maximum: false
      # A 10 m outdoor window sees lane edges and moving obstacles earlier.
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[0.31, 0.225], [0.31, -0.225], [-0.31, -0.225], [-0.31, 0.225]]"
      # Saved-map obstacles keep only a small geometric margin. Live lidar
      # obstacles receive their larger margin in dynamic_obstacle_buffer.
      footprint_padding: 0.04
      # Use Nav2's standard composition order. The earlier experimental order
      # put StaticLayer last; changing its merge mode then exposed every close
      # lidar return at once and the 0.45 m inflation engulfed the robot.
      plugins: [static_layer, voxel_layer, inflation_layer, dynamic_obstacle_buffer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        # The MID-360S is 0.30 m above the ground, while runtime transforms
        # place its origin as low as z=-0.63 m in this costmap frame. Keep the
        # sensor origin inside the grid so raytracing can clear moved objects.
        # Humble supports at most 16 vertical voxels. This grid spans
        # -0.80 m .. 2.08 m.
        origin_z: -0.80
        z_resolution: 0.18
        z_voxels: 16
        max_obstacle_height: 2.08
        # Keep one-voxel marking so an approximately 0.30 m-high obstacle is
        # not lost after the ground-return height filter. Stale-frame flicker
        # is handled at the FAST-LIO publisher queue instead.
        mark_threshold: 1
        unknown_threshold: 15
        observation_sources: body_cloud
        body_cloud:
          topic: /fastlio2/body_cloud
          data_type: PointCloud2
          marking: true
          clearing: true
          # Heights are relative to the 0.30 m-high lidar, not the ground.
          # Keeping the upper part of a 0.30 m obstacle (-0.15 .. 0.0 m in
          # lidar height) detects it while rejecting most ground returns.
          min_obstacle_height: -0.15
          max_obstacle_height: 1.70
          # Ignore close body/mount reflections and observe obstacles earlier.
          obstacle_min_range: 0.35
          obstacle_max_range: 6.0
          raytrace_min_range: 0.35
          raytrace_max_range: 7.0
          observation_persistence: 0.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # This is the small buffer for saved black/gray map obstacles.
        # The dynamic layer below adds a larger buffer only to live lidar data.
        # 0.27 m is just above this footprint's 0.265 m inscribed radius.
        # Smaller values make Nav2's footprint collision model unsafe.
        inflation_radius: 0.27
        cost_scaling_factor: 8.0
        inflate_unknown: false
        inflate_around_unknown: false

      dynamic_obstacle_buffer:
        plugin: scout_navigation_bringup::DynamicObstacleBufferLayer
        enabled: true
        topic: /fastlio2/body_cloud
        map_topic: /map
        inflation_radius: 0.55
        inscribed_radius: 0.34
        cost_scaling_factor: 4.0
        min_obstacle_height: -0.15
        max_obstacle_height: 1.70
        obstacle_min_range: 0.35
        obstacle_max_range: 6.0
        observation_timeout: 0.40
        cluster_resolution: 0.20
        min_points_per_cluster: 3

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      # Clear moved obstacles quickly enough that the next global replan does
      # not keep following a stale detour.
      update_frequency: 5.0
      publish_frequency: 3.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      resolution: 0.05
      track_unknown_space: true
      # Keep gray cells as genuine NO_INFORMATION in the global costmap. Smac
      # then rejects them through allow_unknown=false.
      unknown_cost_value: 255
      lethal_cost_threshold: 100
      trinary_costmap: true
      use_maximum: false
      footprint: "[[0.31, 0.225], [0.31, -0.225], [-0.31, -0.225], [-0.31, 0.225]]"
      # This is a hard geometric planning margin: the 0.45 m-wide body keeps
      # 0.07 m away from occupied/unknown map cells. It is not a larger cost
      # weight and therefore cannot be traded away for a shorter edge path.
      # Global paths may approach saved map edges more closely; local dynamic
      # obstacle buffering still keeps a larger safety margin around live data.
      footprint_padding: 0.05
      plugins: [static_layer, obstacle_layer, inflation_layer, dynamic_obstacle_buffer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      # Feed the live MID-360 cloud into the global costmap as well as the
      # local costmap. Otherwise the global planner only sees the saved map
      # and can generate a path straight through newly detected obstacles.
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: body_cloud
        body_cloud:
          topic: /fastlio2/body_cloud
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.15
          max_obstacle_height: 1.70
          obstacle_min_range: 0.35
          obstacle_max_range: 10.0
          raytrace_min_range: 0.35
          raytrace_max_range: 12.0
          observation_persistence: 0.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # The padded footprint above remains the hard boundary constraint.
        # Do not inflate the global static map: its inscribed-cost band can
        # classify a valid near-edge startup pose as lethal before planning
        # begins. Dynamic-obstacle clearance is handled by the local map.
        enabled: false
        inflation_radius: 0.30
        cost_scaling_factor: 7.0
        inflate_unknown: false
        inflate_around_unknown: true

      # The same live-cloud buffer is used for global replanning, so a new
      # obstacle is avoided before the local controller reaches it.
      dynamic_obstacle_buffer:
        plugin: scout_navigation_bringup::DynamicObstacleBufferLayer
        enabled: true
        topic: /fastlio2/body_cloud
        map_topic: /map
        inflation_radius: 0.55
        inscribed_radius: 0.34
        cost_scaling_factor: 4.0
        min_obstacle_height: -0.15
        max_obstacle_height: 1.70
        obstacle_min_range: 0.35
        obstacle_max_range: 10.0
        observation_timeout: 0.40
        cluster_resolution: 0.20
        min_points_per_cluster: 3

      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 0.75
    planner_plugins: [GridBased]
    GridBased:
      # The differential-drive state lattice uses executable straight/arc
      # primitives and the full rectangular footprint for SE(2) collision
      # checking. A 0.5 m turning radius prevents straight-then-sharp-turn paths.
      plugin: nav2_smac_planner/SmacPlannerLattice
      lattice_filepath: /home/nvidia/auto/ROS2_FOR_SCOUT_MINI/.local_deps/root/opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json
      tolerance: 0.10
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.5
      reverse_penalty: 4.0
      change_penalty: 0.10
      non_straight_penalty: 1.05
      # Boundary clearance comes from the padded footprint collision check.
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      # Differential primitives include rotate-in-place. Keep it available for
      # genuinely confined spaces, but make mid-route shortcut spins expensive.
      rotation_penalty: 20.0
      cache_obstacle_heuristic: false
      allow_reverse_expansion: false
      smooth_path: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Humble loads both NavigateToPose and NavigateThroughPoses trees when the
    # BT navigator activates. The stock multi-pose tree requires these action
    # servers to exist, even though our lane-safe single-goal tree never calls
    # Spin or BackUp.
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: lidar
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.65
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.8

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      # Leave the chassis one second to settle before the next waypoint task.
      waypoint_pause_duration: 1000

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    # Preserve the commanded linear/angular ratio while applying acceleration
    # limits. A sharp turn therefore also reduces forward speed.
    scale_velocities: true
    # Scout velocity feedback is quantized and delayed relative to the 20 Hz
    # smoother. CLOSED_LOOP kept ramping from stale measured yaw rate, causing
    # steering overshoot followed by an opposite correction.
    feedback: OPEN_LOOP
    # Outdoor cruise ceiling. Turning and obstacle avoidance can still reduce
    # the linear speed below this limit.
    max_velocity: [0.50, 0.0, 0.65]
    min_velocity: [-0.15, 0.0, -0.65]
    # Resume promptly after a dynamic obstacle has cleared, while keeping
    # braking stronger than acceleration at the outdoor cruise speed.
    max_accel: [0.50, 0.0, 0.70]
    max_decel: [-1.20, 0.0, -0.90]
    odom_topic: /odom
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.3
