bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.5
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Keep a valid lane path instead of replacing it every second, and never
    # use automatic Spin/BackUp recoveries near road or bridge boundaries.
    default_nav_to_pose_bt_xml: /workspaces/ROS2_FOR_SCOUT_MINI/my_party/navigation_ws/src/scout_navigation_bringup/behavior_trees/navigate_to_pose_lane_safe.xml

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Do not abort and rebuild the route for a single noisy point-cloud frame.
    failure_tolerance: 2.0
    odom_topic: /odom
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.20
      required_movement_angle: 0.10
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Once the position tolerance is reached, keep it latched. Smac 2D uses
      # the approach direction at the last pose, so only a small residual
      # heading correction remains here.
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      # Verified low speed was stable, while a direct jump to 0.50 m/s exposed
      # localization/cloud latency. Use 0.30 m/s as the next validation stage.
      desired_linear_vel: 0.30
      # Track the lane curve tightly enough not to cut into gray/unknown cells.
      lookahead_dist: 0.35
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.65
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.50
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      # Avoid crawling and alternating steering corrections for most of the
      # final metre. Slow down only over the final 0.45 m, then align yaw.
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.45
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 3.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.65
      regulated_linear_scaling_min_speed: 0.08
      cost_scaling_dist: 0.45
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 1.2
      # Scout Mini is differential/skid-steer. Follow ordinary bends with
      # simultaneous linear/angular velocity, never rotate mid-path merely to
      # align with a freshly generated path heading.
      use_rotate_to_heading: false
      allow_reversing: false
      # Kept for documentation/quick rollback only; this threshold is ignored
      # while use_rotate_to_heading is false.
      rotate_to_heading_min_angle: 1.05
      max_angular_accel: 1.20
      # Avoid pruning to a distant, spatially nearby section when the lane
      # curves back near itself.
      max_robot_pose_search_dist: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: lidar
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      track_unknown_space: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.31, 0.225], [0.31, -0.225], [-0.31, -0.225], [-0.31, 0.225]]"
      footprint_padding: 0.07
      # StaticLayer is required here: without it RPP only sees live point-cloud
      # obstacles and may cut across the gray boundary of the saved map.
      plugins: [static_layer, voxel_layer, inflation_layer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        # The transformed sensor origin is about z=-0.33 m in the lidar world
        # frame. It must remain inside the voxel grid or raytracing cannot
        # clear old obstacles, which causes repeated false collisions.
        origin_z: -0.60
        z_resolution: 0.15
        z_voxels: 16
        max_obstacle_height: 1.80
        mark_threshold: 2
        unknown_threshold: 15
        observation_sources: body_cloud
        body_cloud:
          topic: /fastlio2/body_cloud
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.18
          max_obstacle_height: 1.50
          obstacle_min_range: 0.25
          obstacle_max_range: 5.0
          raytrace_min_range: 0.25
          raytrace_max_range: 10.0
          observation_persistence: 0.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # Keep a larger live safety envelope around people and other obstacles.
        inflation_radius: 0.50
        cost_scaling_factor: 1.2
        inflate_unknown: false
        inflate_around_unknown: true

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.31, 0.225], [0.31, -0.225], [-0.31, -0.225], [-0.31, 0.225]]"
      footprint_padding: 0.07
      plugins: [static_layer, obstacle_layer, inflation_layer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      # Feed the live MID-360 cloud into the global costmap as well as the
      # local costmap. Otherwise the global planner only sees the saved map
      # and can generate a path straight through newly detected obstacles.
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: body_cloud
        body_cloud:
          topic: /fastlio2/body_cloud
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.18
          max_obstacle_height: 1.50
          obstacle_min_range: 0.25
          obstacle_max_range: 6.0
          raytrace_min_range: 0.25
          raytrace_max_range: 10.0
          observation_persistence: 0.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # Unknown cells are not traversable. Also inflate from their boundary
        # so a route cannot skim the edge of the white mapped/free region.
        inflation_radius: 0.50
        cost_scaling_factor: 1.2
        inflate_unknown: false
        inflate_around_unknown: true

      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      # Cost-aware 2D A* matches Scout Mini's differential/skid-steer motion:
      # it does not invent Dubin loops to satisfy car-like turning constraints.
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.15
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # Larger than the default 2.0 so paths prefer the interior of the white
      # lane instead of the shortest route along its inflated edge.
      cost_travel_multiplier: 3.0
      # End with the direction of approach. Do not insert a last-pose yaw jump
      # that forces an in-place rotation at the goal.
      use_final_approach_orientation: true
      smoother:
        max_iterations: 1000
        # Preserve the collision-checked path while removing grid roughness;
        # excessive smoothing may otherwise cut toward a boundary at corners.
        w_smooth: 0.20
        w_data: 0.30
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Humble loads both NavigateToPose and NavigateThroughPoses trees when the
    # BT navigator activates. The stock multi-pose tree requires these action
    # servers to exist, even though our lane-safe single-goal tree never calls
    # Spin or BackUp.
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: lidar
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.60
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: CLOSED_LOOP
    max_velocity: [0.50, 0.0, 0.65]
    min_velocity: [-0.15, 0.0, -0.65]
    max_accel: [0.60, 0.0, 1.20]
    max_decel: [-0.80, 0.0, -1.20]
    odom_topic: /odom
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
