bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.5
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    odom_topic: /odom
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.20
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Once the position tolerance is reached, keep it latched. The hybrid
      # path should already have aligned most of the final heading, leaving
      # only a small residual correction here.
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.50
      # At 0.50 m/s the velocity-scaled preview is capped at 0.70 m. The
      # 0.35 m minimum still filters small grid/pose errors at low speed.
      lookahead_dist: 0.35
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.70
      lookahead_time: 3.5
      rotate_to_heading_angular_vel: 0.30
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      # Avoid crawling and alternating steering corrections for most of the
      # final metre. Slow down only over the final 0.45 m, then align yaw.
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.45
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 3.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.08
      cost_scaling_dist: 0.55
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 1.5
      use_rotate_to_heading: true
      allow_reversing: false
      # Align with the first path segment before translating when the heading
      # error exceeds about 11.5 degrees. This prevents a diagonal launch into
      # the lane when the robot initially faces away from the lane direction.
      rotate_to_heading_min_angle: 0.20
      max_angular_accel: 0.80
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: lidar
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.31, 0.225], [0.31, -0.225], [-0.31, -0.225], [-0.31, 0.225]]"
      footprint_padding: 0.07
      plugins: [voxel_layer, inflation_layer]

      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        # body is about 0.25 m above the ground on this installation.
        origin_z: -0.30
        z_resolution: 0.125
        z_voxels: 16
        max_obstacle_height: 1.80
        mark_threshold: 2
        unknown_threshold: 15
        observation_sources: body_cloud
        body_cloud:
          topic: /fastlio2/body_cloud
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.18
          max_obstacle_height: 1.50
          obstacle_min_range: 0.25
          obstacle_max_range: 5.0
          raytrace_min_range: 0.25
          raytrace_max_range: 10.0
          observation_persistence: 0.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # Keep a larger live safety envelope around people and other obstacles.
        inflation_radius: 0.60
        cost_scaling_factor: 1.5

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.31, 0.225], [0.31, -0.225], [-0.31, -0.225], [-0.31, 0.225]]"
      footprint_padding: 0.07
      plugins: [static_layer, obstacle_layer, inflation_layer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      # Feed the live MID-360 cloud into the global costmap as well as the
      # local costmap. Otherwise the global planner only sees the saved map
      # and can generate a path straight through newly detected obstacles.
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: body_cloud
        body_cloud:
          topic: /fastlio2/body_cloud
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.18
          max_obstacle_height: 1.50
          obstacle_min_range: 0.25
          obstacle_max_range: 6.0
          raytrace_min_range: 0.25
          raytrace_max_range: 10.0
          observation_persistence: 0.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # Keep the global route away from walls and doorway edges instead of
        # optimizing for the geometrically shortest, wall-hugging path.
        inflation_radius: 0.55
        cost_scaling_factor: 1.5

      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      # Hybrid A* plans x/y/yaw together. This turns toward the requested final
      # heading along the approach instead of leaving a large in-place rotation
      # until after the goal position has been reached.
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.15
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.5
      minimum_turning_radius: 0.50
      reverse_penalty: 2.1
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 3.0
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      debug_visualizations: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.30
        w_data: 0.20
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: lidar
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.60
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: CLOSED_LOOP
    max_velocity: [0.50, 0.0, 0.45]
    min_velocity: [-0.15, 0.0, -0.45]
    max_accel: [0.60, 0.0, 0.80]
    max_decel: [-0.80, 0.0, -0.80]
    odom_topic: /odom
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
