pointcloud_map_projection:
  ros__parameters:
    # Input paths are filled from map_dir by map_conversion.launch.py.
    pcd_file: ""
    poses_file: ""
    patches_dir: ""
    remove_self_points: false

    # Scout Mini and lidar-visible mounting hardware in the FAST-LIO2 body frame.
    self_filter.min_x: -0.65
    self_filter.max_x: 0.65
    self_filter.min_y: -0.55
    self_filter.max_y: 0.55
    self_filter.min_z: -1.00
    self_filter.max_z: 0.35

    output_topic: /map
    frame_id: map
    resolution: 0.05
    z_min: 0.15
    z_max: 1.20
    voxel_leaf_size: 0.05
    enable_radius_filter: true
    radius_search: 0.15
    min_neighbors: 3
    map_padding: 0.50
    free_space_radius: 0.80
    trajectory_clear_radius: 0.35
    unobserved_value: -1
