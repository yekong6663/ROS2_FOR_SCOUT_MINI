pointcloud_map_projection:
  ros__parameters:
    # Use the cleaned complete map saved after Fast-LIO2 mapping.
    pcd_file: /absolute/path/to/GlobalMap.pcd
    output_topic: /map
    frame_id: map

    resolution: 0.05
    # Heights are measured in the gravity-aligned PCD/map frame.
    z_min: 0.15
    z_max: 1.20

    # Downsample before filtering to keep large PCD conversion inexpensive.
    voxel_leaf_size: 0.05
    enable_radius_filter: true
    radius_search: 0.15
    min_neighbors: 3
    map_padding: 0.50

    # Unobserved space is unsafe by default. Mark confirmed drivable areas as
    # free during final map review instead of changing this to 0 blindly.
    unobserved_value: -1
