pointcloud_map_projection:
  ros__parameters:
    # PGO map and matching keyframe poses. The trajectory is used to mark only
    # confirmed traversed space as free instead of treating all unknown space as drivable.
    pcd_file: /workspaces/ROS2_FOR_SCOUT_MINI/maps/indoor_01/map.pcd
    poses_file: /workspaces/ROS2_FOR_SCOUT_MINI/maps/indoor_01/poses.txt
    output_topic: /map
    frame_id: map

    resolution: 0.05
    # Heights are measured in the gravity-aligned PCD/map frame.
    z_min: 0.15
    z_max: 1.20

    # Downsample before filtering to keep large PCD conversion inexpensive.
    voxel_leaf_size: 0.05
    enable_radius_filter: true
    radius_search: 0.15
    min_neighbors: 3
    map_padding: 0.50

    # Radius around the interpolated vehicle trajectory marked as free (0).
    # Keep this no wider than the actually observed drivable corridor.
    free_space_radius: 0.80
    # Optional confirmed robot-footprint clearing after obstacle projection.
    trajectory_clear_radius: 0.0

    # All space outside the trajectory corridor remains unknown and unsafe.
    unobserved_value: -1
